; ============================================================
; FarmaPonto - configuracao do PHP embutido (versao de secretaria)
; ============================================================
; Objectivo: correr apenas esta aplicacao, sem rede exterior e sem
; expor o codigo. Todas as extensoes necessarias vem no pacote.

extension_dir = "ext"

extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=openssl
extension=fileinfo
extension=gd
extension=zip

; ---------- Comportamento ----------
memory_limit = 256M
max_execution_time = 120
post_max_size = 24M
upload_max_filesize = 16M
default_charset = "UTF-8"
date.timezone = "Africa/Maputo"

; ---------- Nada de erros no ecra do utilizador ----------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; ---------- Sem acesso a rede exterior ----------
allow_url_fopen = Off
allow_url_include = Off

; ---------- Protecao do codigo ----------
; Funcoes que permitiriam ler ou executar coisas fora da aplicacao.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,phpinfo
expose_php = Off

; ---------- Desempenho ----------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
zend_extension=opcache
